[project]
name = "rag-project"
version = "0.1.0"
description = "Testing rag"
readme = "README.md"
authors = [
    { name = "MannyYebz", email = "mannyyebz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.0",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
